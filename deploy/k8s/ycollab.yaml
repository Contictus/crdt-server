# A running deployment of ycollab.
#
#   kubectl apply -f deploy/k8s/ycollab.yaml
#
# Postgres and Redis are expected to exist already and to be named by the
# Secret below: this file deploys the server, not a database. Running a
# production Postgres from a YAML file in an application's repository is how
# people lose data.
#
# The shape follows from what the server is. Replicas are interchangeable, so
# this is a plain Deployment with no ordinals and no sticky sessions - a client
# reconnecting to a different pod costs one state vector diff. The admin port is
# never named in the Service, so /debug/pprof and /metrics are reachable from
# inside the cluster and from nowhere else.
apiVersion: v1
kind: Namespace
metadata:
  name: ycollab

---
# The two things this deployment cannot invent for itself. Create it with real
# values before applying the rest:
#
#   kubectl -n ycollab create secret generic ycollab \
#     --from-literal=database-url='postgres://user:pass@postgres:5432/ycollab' \
#     --from-literal=redis-url='redis://redis:6379' \
#     --from-literal=jwt-secret="$(go run ./cmd/ycollab-token -gen-secret)"
#
# It is here as a placeholder so that `kubectl apply` of this file alone does
# not silently start an open server with no persistence.
#
# The two credentials below are deliberately too short to be accepted - the
# server refuses a signing secret under 32 bytes and an admin token under 16 -
# so a cluster that applied this file unedited gets pods that crash-loop with
# the reason in their logs. That is the intended outcome. A placeholder long
# enough to pass validation would instead produce a running server whose secret
# is published in this repository, which is an open server with extra steps.
apiVersion: v1
kind: Secret
metadata:
  name: ycollab
  namespace: ycollab
type: Opaque
stringData:
  database-url: "postgres://ycollab:ycollab@postgres:5432/ycollab"
  redis-url: "redis://redis:6379"
  # Replace. `go run ./cmd/ycollab-token -gen-secret`
  jwt-secret: "REPLACE-ME"
  # Guards the admin listener, which can read, overwrite and delete every
  # document. Replace this one too - `openssl rand -hex 32`.
  admin-token: "REPLACE-ME"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ycollab
  namespace: ycollab
  labels: { app: ycollab }
spec:
  replicas: 3
  selector:
    matchLabels: { app: ycollab }
  template:
    metadata:
      labels: { app: ycollab }
      # No prometheus.io/scrape annotations. The admin listener requires the
      # token below, and annotation-based discovery has nowhere to put a
      # credential - it would produce a scrape job that collects 401s and an
      # alert rule that fires because nothing is being scraped. Point Prometheus
      # at the headless Service further down instead, with the token:
      #
      #   - job_name: ycollab
      #     kubernetes_sd_configs:
      #       - role: endpoints
      #         namespaces: { names: [ycollab] }
      #     relabel_configs:
      #       - source_labels: [__meta_kubernetes_endpoints_name,
      #                         __meta_kubernetes_endpoint_port_name]
      #         regex: ycollab-admin;admin
      #         action: keep
      #     authorization:
      #       type: Bearer
      #       credentials_file: /etc/prometheus/secrets/ycollab/admin-token
      #
      # With the Prometheus Operator the same thing is a ServiceMonitor whose
      # `authorization.credentials` names the `admin-token` key of the Secret
      # above, with the Secret mirrored into Prometheus's namespace.
    spec:
      # A pod being replaced holds WebSocket connections that are worth closing
      # properly: the server drains its listener and sends 1001, and clients
      # reconnect to another pod with a diff rather than a full resync.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: server
          # A registry, not a bare `ycollab:latest`: a name with no registry
          # resolves to Docker Hub, where this image is not, so every pod on a
          # normal cluster would sit in ImagePullBackOff.
          #
          # `main` is the tip of the branch, which is what exists while nothing
          # has been released yet. Pin this to a version tag - the release
          # workflow publishes one per `v*` tag - as soon as there is one:
          # a floating tag makes "which build is running" a question with no
          # answer, and the pods here already report their build on /statsz.
          image: ghcr.io/contictus/crdt-server:main
          # Always, because the tag above moves. A version tag does not, and
          # IfNotPresent is the right setting the moment this is pinned.
          imagePullPolicy: Always
          args:
            - -addr=:8080
            # Bound to all interfaces because "localhost" in a pod means the
            # pod; the Service below is what keeps it private.
            - -admin-addr=:6060
            # -origins, -database-url, -redis-url and -jwt-secret all come from
            # the environment below: the server reads YCOLLAB_* as each flag's
            # default, so a secret never appears in a pod's command line, where
            # `kubectl describe` and /debug/pprof/cmdline would both show it.
            #
            # Bounds, because a pod has a memory limit and nothing else in the
            # server caps how many documents or connections it will hold.
            - -max-rooms=2000
            - -max-conns=5000
            # And a bound per client address, so one actor cannot reach
            # -max-conns alone. Generous, because a real person has several
            # tabs and everybody behind one office NAT shares an address.
            - -max-conns-per-ip=100
            # The ingress controller is inside the cluster network, so its
            # X-Forwarded-For is worth believing. Without this the header is
            # ignored and every client would look like the ingress - which
            # would make the cap above a cap on the whole deployment.
            - -trusted-proxies=private
            - -log-level=info
          env:
            - name: YCOLLAB_ORIGINS
              value: "app.example.com"
            - name: YCOLLAB_DATABASE_URL
              valueFrom: { secretKeyRef: { name: ycollab, key: database-url } }
            - name: YCOLLAB_REDIS_URL
              valueFrom: { secretKeyRef: { name: ycollab, key: redis-url } }
            - name: YCOLLAB_JWT_SECRET
              valueFrom: { secretKeyRef: { name: ycollab, key: jwt-secret } }
            # The alternative to the token above: let the application decide per
            # connection instead of minting a capability per document. Set one or
            # the other - the server refuses to start with both, because that
            # would mean picking a winner when they disagree.
            #
            #   - name: YCOLLAB_AUTH_URL
            #     value: "http://your-app.default.svc.cluster.local/ycollab/authorize"
            #   - name: YCOLLAB_AUTH_SECRET
            #     valueFrom: { secretKeyRef: { name: ycollab, key: auth-secret } }
            #
            # Add -auth-fail-open to the args only as a deliberate choice: it
            # keeps documents served while that endpoint is down, which means
            # anybody who can reach this Service may read and write any of them.
            # The admin listener serves POST and DELETE on every document, so
            # the Service below not naming the port is the first control and
            # this is the second. Prometheus needs it too: give the scrape job
            # an `authorization` block carrying the same value.
            #
            # Comma-separated during a rotation: add the new one, update every
            # holder, then use the audit trail's credential fingerprint to
            # confirm the old one has stopped being used before removing it.
            - name: YCOLLAB_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: ycollab, key: admin-token } }
            # The audit trail goes to stdout by default, where kubectl logs and
            # every log collector already pick it up - and the process log is on
            # stderr, so the two arrive already separated. Set this to a path
            # only if the trail has to go somewhere the collector is not, and
            # mount a volume for it: a file inside the container dies with it.
            - name: YCOLLAB_AUDIT_LOG
              value: "-"
            # Snapshots and version payloads in object storage instead of in
            # PostgreSQL. History is a whole document per version, twenty-four
            # per document by default, so this is the difference between a
            # database holding terabytes of blobs it never queries and one
            # holding rows.
            #
            #   - name: YCOLLAB_S3_BUCKET
            #     value: "ycollab"
            #   - name: YCOLLAB_S3_REGION
            #     value: "eu-west-1"
            #   - name: YCOLLAB_S3_PREFIX
            #     value: "prod/"
            #   - name: AWS_ACCESS_KEY_ID
            #     valueFrom: { secretKeyRef: { name: ycollab, key: s3-access-key } }
            #   - name: AWS_SECRET_ACCESS_KEY
            #     valueFrom: { secretKeyRef: { name: ycollab, key: s3-secret-key } }
            #
            # A Secret, not a service account annotation: the client here signs
            # with SigV4 directly and does not implement IRSA. And note that a
            # pg_dump stops being a backup once this is on - the rows name
            # objects. Back up both, or rely on the bucket's own versioning.
            #
            # Multi-tenancy is a property of the tokens, not of a flag here: put
            # an "own" claim in them (or return "owner" from -auth-url) and a
            # document becomes reachable only by the tenant that opened it.
            # Nothing to configure on this side, and nothing changes for a
            # deployment whose tokens carry no owner - see the runbook before
            # turning it on for a database that already has documents in it.
          ports:
            - { name: ws, containerPort: 8080 }
            - { name: admin, containerPort: 6060 }
          # Readiness gates traffic; liveness restarts. They point at different
          # ports on purpose: readiness asks the port clients use, because that
          # is what the question is about.
          readinessProbe:
            httpGet: { path: /healthz, port: ws }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: admin }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { memory: "1Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

---
# Only the client port is published. The admin port is deliberately absent:
# that is what keeps /debug/pprof - which dumps the heap and will stall the
# process for a profile - off the network.
apiVersion: v1
kind: Service
metadata:
  name: ycollab
  namespace: ycollab
  labels: { app: ycollab }
spec:
  selector: { app: ycollab }
  ports:
    - { name: ws, port: 80, targetPort: ws }

---
# A headless Service for the admin port, so Prometheus can scrape pods directly
# without the port being routable as a normal Service.
apiVersion: v1
kind: Service
metadata:
  name: ycollab-admin
  namespace: ycollab
  labels: { app: ycollab }
spec:
  clusterIP: None
  selector: { app: ycollab }
  ports:
    - { name: admin, port: 6060, targetPort: admin }

---
# WebSocket connections are long-lived, so the ingress must not impose a read
# timeout on them. The annotations here are nginx's; another controller needs
# its own equivalents, and getting this wrong shows up as every client
# reconnecting exactly every 60 seconds.
#
# TLS is not optional here, and not only for the usual reason: the token that
# authorises a connection travels in the WebSocket URL's query string, because
# the browser WebSocket API has no way to set a header. On plain ws:// that
# capability is on the wire in clear text. The Secret below is expected to exist
# already - cert-manager writes one, or `kubectl create secret tls`.
#
# The host is where the WebSocket lives, and it is deliberately not the host in
# YCOLLAB_ORIGINS above: that one is the origin of the page holding the editor,
# which is what the browser sends as Origin and what the server checks. An
# application served from the same host would name this host in both.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ycollab
  namespace: ycollab
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # No plain-HTTP route to the same address, so a client that starts at ws://
    # is redirected rather than served.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  # Named rather than left to the cluster's default: a cluster with two
  # controllers, or with none marked default, silently leaves this Ingress
  # unclaimed and the address never starts answering.
  ingressClassName: nginx
  tls:
    - hosts: [collab.example.com]
      secretName: ycollab-tls
  rules:
    - host: collab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ycollab
                port: { name: ws }

---
# Scaling on CPU rather than on connection count: a connection that nobody is
# typing into costs almost nothing, so connection count is a poor signal of
# load, while integrating updates and fanning them out is what actually burns a
# core.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ycollab
  namespace: ycollab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ycollab
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
  behavior:
    scaleDown:
      # Scaling down disconnects people. Slowly, and only when the load has
      # genuinely gone.
      stabilizationWindowSeconds: 300

---
# Losing every replica at once would disconnect everybody at once. They would
# all reconnect, but a node drain should not do that.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ycollab
  namespace: ycollab
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: ycollab }
