# The Phase 4 deployment: three replicas of the server, one Postgres, one Redis,
# and Caddy in front.
#
#   docker compose -f deploy/docker-compose.cluster.yml up -d --build
#   node tools/soak/soak.mjs --clients 6 --duration 300 \
#     --urls ws://127.0.0.1:8081,ws://127.0.0.1:8082,ws://127.0.0.1:8083 \
#     --stats http://127.0.0.1:6081,http://127.0.0.1:6082,http://127.0.0.1:6083
#
# Each replica is published on its own port as well as being behind Caddy. That
# is what lets a test put client A on one replica and client B on another and
# prove they are in sync, which is the acceptance criterion; through the load
# balancer alone you cannot tell which replica you got.
# Its own project name, so this does not adopt or replace the containers
# docker-compose.yml created: both files define a "postgres" and a "redis", and
# sharing a project would silently take the published ports away from the
# development ones the Go integration tests connect to.
name: ycollab-cluster

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ycollab
      POSTGRES_PASSWORD: ycollab
      POSTGRES_DB: ycollab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycollab -d ycollab"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  ycollab-1: &replica
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - -addr=:8080
      # The admin listener binds to all interfaces here, unlike its localhost
      # default, because "localhost" inside a container means the container. It
      # is still a separate port, so the compose file decides who sees it - and
      # in a real deployment that port would not be published at all, only
      # scraped from inside the network.
      - -admin-addr=:6060
      # The browser demo runs on the Vite dev server, so its origin has to be
      # allowed explicitly; a same-origin default would reject it.
      - -origins=localhost:5173,127.0.0.1:5173,localhost:8080,127.0.0.1:8080
      - -database-url=postgres://ycollab:ycollab@postgres:5432/ycollab
      - -redis-url=redis://redis:6379
      - -log-level=info
      # No -jwt-secret, so this deployment is open: it exists to demonstrate the
      # fanout, and a secret checked in here would be a secret in a git history.
      # To require tokens, give every replica the same one - they all verify the
      # same signature, which is what lets a client reconnect to any of them:
      #   - -jwt-secret=${YCOLLAB_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:6081:6060"

  # The other two are the same process with a different published port. A YAML
  # anchor rather than three copies: three copies is how one of them ends up with
  # a flag the others do not have.
  ycollab-2:
    <<: *replica
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:6082:6060"

  ycollab-3:
    <<: *replica
    ports:
      - "127.0.0.1:8083:8080"
      - "127.0.0.1:6083:6060"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      ycollab-1:
        condition: service_healthy
      ycollab-2:
        condition: service_healthy
      ycollab-3:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
